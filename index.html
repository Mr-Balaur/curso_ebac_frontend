<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <title>Barnabas Livros</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand px-4" href="#">Barnabas Livros</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#conteudoNavbarSuportado" aria-controls="conteudoNavbarSuportado" aria-expanded="false" aria-label="Alterna navegação">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-end" id="conteudoNavbarSuportado">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Nossos Livros</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Comunidade</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Publique</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Login</a>
                    </li>
                </ul>
            </div>
            <div class="d-none d-lg-block px-4"></div>
        </div>
    </nav>

    <div class="container my-4">
        <h2 class="h2 mb-4">Preencha os campos abaixo para prosseguir.</h2>
        <form>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label" for="nome">Nome</label>
                    <input class="form-control" id="nome" type="text" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="sobrenome">Sobrenome</label>
                    <input class="form-control" id="sobrenome" type="text" required>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label" for="username">Usuário</label>
                    <input class="form-control" id="username" type="text" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="password">Senha</label>
                    <input class="form-control" id="password" type="password" autocomplete="password" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="email">E-mail</label>
                <input class="form-control" autocomplete="email" id="email" type="email" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label" for="telefone">Telefone</label>
                <input class="form-control" id="telefone" type="tel" required>
            </div>
            
            <div class="mb-3">
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="aceite-termo" required>
                    <label class="form-check-label" for="aceite-termo">Li e concordo com os <a href="#">termos de serviço</a>.</label>
                </div>
            </div>
            
            <button class="btn btn-dark" type="submit">Cadastre-se</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
